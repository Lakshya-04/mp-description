# Profile: KUKA LBR iiwa 7 R800 (7-DOF, primitives, published kinematics and limits) on the telescopic lift.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: iiwa7
    base: generic_base
    lift_stroke: 1.5
    lift_stages: 2
    lift_max_velocity: 0.2
    tcp_xyz: "0 0 0.15"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 7
  controller_family: arm7

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
  mimic: [lift_stage_1_joint, lift_stage_2_joint]

lift:
  type: telescopic
  stroke_m: 1.5
  max_velocity_mps: 0.2
  stages: 2
  max_acceleration_mps2: 0.5
  mount_height_m: 0.82   # lift_output_link above lift_base_link, retracted
  payload_kg: 150        # note only: the real lift's rated payload, not used by the model

# Ready posture, lift part way up. Not checked for self-collision on this arm in a simulator.
home:
  lift_joint: 0.4
  arm_joint1: 0.0
  arm_joint2: 0.5
  arm_joint3: 0.0
  arm_joint4: -1.2
  arm_joint5: 0.0
  arm_joint6: 0.8
  arm_joint7: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: generic_base
  description: "Generic box base (no wheels, nominal values)"
  drive_type: omni          # omni | diff | skid | 4ws
  can_strafe: true
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.4500, -0.3000]
    - [0.4500, -0.3000]
    - [0.4500, 0.3000]
    - [-0.4500, 0.3000]
  wheel_radius_m: null
  track_m: null
  wheelbase_m: null
  max_linear_velocity_mps: 0.5
  max_angular_velocity_radps: 1.0
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 1.0
  lift_mount_height_m: 0.35     # lift_mount_link above base_footprint
  ground_clearance_m: 0.05
  mass_kg: 60.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
