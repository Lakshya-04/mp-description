# Profile: UR10e on a scissor lift (prismatic master joint, visual scissor linkage on mimic joints).
robot:
  name: mobile_manipulator
  xacro_args:
    arm: ur10e
    tcp_xyz: "0 0 0.165"

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
  # Followed through <mimic>, never commanded (three X-levels: centre + two arms each).
  mimic:
    - lift_scissor_0_center_joint
    - lift_scissor_0_a_joint
    - lift_scissor_0_b_joint
    - lift_scissor_1_center_joint
    - lift_scissor_1_a_joint
    - lift_scissor_1_b_joint
    - lift_scissor_2_center_joint
    - lift_scissor_2_a_joint
    - lift_scissor_2_b_joint

lift:
  type: scissor
  stroke_m: 1.0
  stages: 3                 # X-levels
  mount_height_m: 0.27      # lift_output_link above lift_base_link, collapsed (minimum height)
  max_velocity_mps: 0.1
  max_acceleration_mps2: 0.3
  payload_kg: 300           # note only: the real lift's rated payload, not used by the model

home:
  lift_joint: 0.3
  arm_shoulder_pan_joint: 0.0
  arm_shoulder_lift_joint: -1.5708
  arm_elbow_joint: 1.5708
  arm_wrist_1_joint: -1.5708
  arm_wrist_2_joint: -1.5708
  arm_wrist_3_joint: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: generic_base
  description: "Generic box base (no wheels, nominal values)"
  drive_type: omni          # omni | diff | skid | 4ws
  can_strafe: true
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.4500, -0.3000]
    - [0.4500, -0.3000]
    - [0.4500, 0.3000]
    - [-0.4500, 0.3000]
  wheel_radius_m: null
  track_m: null
  wheelbase_m: null
  max_linear_velocity_mps: 0.5
  max_angular_velocity_radps: 1.0
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 1.0
  lift_mount_height_m: 0.35     # lift_mount_link above base_footprint
  ground_clearance_m: 0.05
  mass_kg: 60.0
